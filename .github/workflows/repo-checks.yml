name: Repository checks

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            diff_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            export DIFF_BASE="$diff_base"
            export DIFF_HEAD="$HEAD_SHA"
          fi
          python - <<'PY'
          import subprocess
          from pathlib import Path

          import yaml

          config = yaml.safe_load(Path(".gitlab-ci.yml").read_text(encoding="utf-8"))
          subprocess.run(["bash", "-e", "-c", config["repo-checks"]["script"][0]], check=True)
          PY

  release-tag:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - run: git push origin "${GITHUB_SHA}:refs/tags/build-${GITHUB_SHA}"

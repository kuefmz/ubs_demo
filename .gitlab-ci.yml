workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'

stages:
  - validate
  - release

default:
  image: python:3.12-bookworm

variables:
  GIT_DEPTH: "0"

repo-checks:
  stage: validate
  before_script:
    - python -m pip install PyYAML==6.0.3
  script:
    - |
      if [ "${CI_PIPELINE_SOURCE:-}" = "merge_request_event" ]; then
        export DIFF_BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
        export DIFF_HEAD="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}"
      fi
      python - <<'PY'
      """Validate repository metadata and dependency changes from the checkout root."""
      import os
      import re
      import subprocess
      import sys
      from pathlib import Path

      import yaml


      def changed_paths(base, head):
          output = subprocess.check_output(
              ["git", "diff", "--no-renames", "--name-only", "-z", base, head, "--"]
          )
          return set(os.fsdecode(output).split("\0")) - {""}


      def validate(base=None, head=None):
          errors = []
          metadata = yaml.safe_load(Path("project_config.yaml").read_text(encoding="utf-8"))
          if not isinstance(metadata, dict):
              return ["project_config.yaml must contain a mapping"]

          if type(metadata.get("project_id")) is not int:
              errors.append("project_id must be an integer")

          for field in (
              "project_name",
              "owner",
              "groupshare_location_logs_green",
              "adt_application_id_prod",
              "adt_application_id_uat",
          ):
              value = metadata.get(field)
              if not isinstance(value, str) or not value.strip():
                  errors.append(f"{field} must be a non-empty string")

          if not isinstance(metadata.get("groupshare_location_logs_red"), str):
              errors.append('groupshare_location_logs_red must be a string (use "" if unused)')

          version = metadata.get("python_version")
          if not isinstance(version, str) or not re.fullmatch(r"3\.\d+", version):
              errors.append('python_version must be a quoted major.minor string, e.g. "3.12"')

          access = metadata.get("required_access")
          if not isinstance(access, dict):
              errors.append("required_access must contain bbs, sharepoint, and gropshare")
          else:
              for field in ("bbs", "sharepoint", "gropshare"):
                  items = access.get(field)
                  if not isinstance(items, list):
                      errors.append(f"required_access.{field} must be a list (use [] if unused)")
                  elif any(not isinstance(item, str) or not item.strip() for item in items):
                      errors.append(f"required_access.{field} entries must be non-empty strings")

          if not Path("requirements.txt").is_file():
              errors.append("requirements.txt is required")
          if base and head:
              changed = changed_paths(base, head)
              dependency_files = {"pyproject.toml", "setup.py", "setup.cfg"}
              if changed & dependency_files and "requirements.txt" not in changed:
                  errors.append("Update requirements.txt when changing a dependency manifest")
              print("requirements.txt:", "updated" if "requirements.txt" in changed else "unchanged")
          return errors


      if __name__ == "__main__":
          try:
              problems = validate(os.environ.get("DIFF_BASE"), os.environ.get("DIFF_HEAD"))
          except (OSError, UnicodeError, yaml.YAMLError, subprocess.CalledProcessError) as error:
              sys.exit(f"Validation could not run: {error}")
          if problems:
              sys.exit("\n".join(problems))
          print("Repository checks passed")
      PY

release-tag:
  stage: release
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - git push "$CI_REPOSITORY_URL" "${CI_COMMIT_SHA}:refs/tags/build-${CI_COMMIT_SHA}"
